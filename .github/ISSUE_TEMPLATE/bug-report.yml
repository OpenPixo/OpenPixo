name: 🐛 Bug report
description: Something isn't working as expected in OpenPixo.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! A clear, reproducible report helps us fix it faster.

        Before you submit:
        - Search this repository's existing issues before submitting a new report.
        - Replace example text with your actual bug details. Placeholder reports like `testing` or `0.0.0` are not actionable.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I replaced the example text with the real behavior, reproduction steps, expected result, and version from the app's About menu or `pixo --version`.
          required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the real bug you hit, not example or placeholder text.
      placeholder: When I do X, I expected Y but I see Z.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps that reliably reproduce the problem.
      placeholder: |
        1. Open OpenPixo
        2. Click ...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OpenPixo version
      description: Find this in the app's About menu, or run `pixo --version`.
      placeholder: e.g. 1.0.4
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
        - Other
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Which AI were you using?
      options:
        - OpenPixo hosted models (signed in)
        - Codex
        - Claude Code
        - OpenCode
        - Not related to the AI
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Paste any error text you saw. If you run OpenPixo from source, add the output of `pnpm tools-dev logs --json`. Remove API keys and personal details first.
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag and drop or paste images here to show the visual bug.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that helps, such as the game engine, a recipe or plugin you used, or related issues.
    validations:
      required: false
